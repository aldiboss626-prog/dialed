<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E8E2D8; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
  @keyframes dl-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes dl-expand { from { opacity: 0; transform: translateY(-8px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes dl-slide-in { from { transform: translateX(100%) } to { transform: translateX(0) } }
  @keyframes dl-sheet-up { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes dl-checkpop { 0% { transform: scale(0) } 60% { transform: scale(1.15) } 100% { transform: scale(1) } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
